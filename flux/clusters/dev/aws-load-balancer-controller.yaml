---
# Gateway API CRDs (required first)
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.0.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: "./config/crd/standard"
  prune: false  # Don't prune CRDs
---
# AWS Load Balancer Controller with Gateway API support
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: eks-charts
  namespace: flux-system
spec:
  interval: 1h
  url: https://aws.github.io/eks-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: aws-load-balancer-controller
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: gateway-api-crds
  chart:
    spec:
      chart: aws-load-balancer-controller
      version: "1.8.1"
      sourceRef:
        kind: HelmRepository
        name: eks-charts
        namespace: flux-system
  targetNamespace: kube-system
  values:
    clusterName: crowdunlocked-dev
    serviceAccount:
      create: true
      name: aws-load-balancer-controller
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::179151668767:role/crowdunlocked-dev-alb-controller
    region: us-west-2
    vpcId: vpc-0621553c682c74448
    # Enable Gateway API support
    enableGatewayAPI: true
    # Disable legacy ingress support (optional - can keep both)
    disableIngressClassAnnotation: false
    enableServiceMutatorWebhook: false