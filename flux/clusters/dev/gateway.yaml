---
# GatewayClass - defines the controller
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-alb
spec:
  controllerName: aws-gateway-controller
---
# Gateway - the actual load balancer
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: crowdunlocked-gateway
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Certificate will be auto-discovered by domain name
spec:
  gatewayClassName: aws-alb
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  - name: https
    protocol: HTTPS
    port: 443
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
---
# HTTPRoute - routing rules
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crowdunlocked-route
  namespace: default
spec:
  parentRefs:
  - name: crowdunlocked-gateway
  hostnames:
  - "crowdunlockedbeta.com"
  - "www.crowdunlockedbeta.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: crowd-unlocked-hello
      port: 80