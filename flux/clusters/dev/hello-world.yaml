---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowd-unlocked-hello
  namespace: default
  labels:
    app: crowd-unlocked-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crowd-unlocked-hello
  template:
    metadata:
      labels:
        app: crowd-unlocked-hello
    spec:
      containers:
      - name: hello
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: html
        configMap:
          name: crowd-unlocked-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowd-unlocked-html
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Crowd Unlocked</title>
        <style>
            body {
                font-family: 'Arial', sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                color: white;
            }
            .container {
                text-align: center;
                padding: 2rem;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 20px;
                backdrop-filter: blur(10px);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            }
            h1 {
                font-size: 3rem;
                margin-bottom: 1rem;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            }
            p {
                font-size: 1.2rem;
                margin-bottom: 2rem;
                opacity: 0.9;
            }
            .status {
                background: rgba(0, 255, 0, 0.2);
                padding: 1rem;
                border-radius: 10px;
                border: 1px solid rgba(0, 255, 0, 0.3);
            }
            .emoji {
                font-size: 2rem;
                margin: 0 0.5rem;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🎉 Crowd Unlocked 🎉</h1>
            <p>Your Kubernetes cluster is running!</p>
            <div class="status">
                <span class="emoji">✅</span>
                <strong>EKS Cluster:</strong> Active<br>
                <span class="emoji">🚀</span>
                <strong>Flux GitOps:</strong> Syncing<br>
                <span class="emoji">🎯</span>
                <strong>Managed Node Groups:</strong> Ready<br>
                <span class="emoji">🌟</span>
                <strong>Status:</strong> Production Ready!
            </div>
        </div>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: crowd-unlocked-hello
  namespace: default
  labels:
    app: crowd-unlocked-hello
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: crowd-unlocked-hello