name: CI

# Web app CI. Deployment is handled by Vercel's GitHub integration, not here.
# Infrastructure (DynamoDB + Vercel OIDC) lives in infra/terraform/dev and is
# validated on PRs that touch it via the plan-only job below.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  id-token: write # Required for OIDC (terraform plan)
  pull-requests: write

jobs:
  web:
    name: Web App (lint, test, type-check, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Test
        working-directory: apps/web
        run: npm test -- --passWithNoTests

      - name: Type Check
        working-directory: apps/web
        run: npm run type-check

      - name: Build
        working-directory: apps/web
        run: npm run build

  terraform-plan:
    name: OpenTofu Plan (dev, plan-only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          # Must be >= the version that wrote the state (1.12.x). OpenTofu
          # refuses to read state written by a newer version.
          tofu_version: "1.12.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_DEV }}
          aws-region: us-west-2

      - name: OpenTofu Init
        working-directory: infra/terraform/dev
        run: tofu init

      - name: OpenTofu Validate
        working-directory: infra/terraform/dev
        run: tofu validate

      - name: OpenTofu Plan
        working-directory: infra/terraform/dev
        # plan-only, read-only: don't take the state lock
        run: tofu plan -var-file=dev.tfvars -lock=false
